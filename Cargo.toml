[workspace]
resolver = "2"
members = [
    "crates/agnijs-engine-api",
    "crates/agnijs-engine-quickjs",
    "crates/agnijs-js-parser",
    "crates/agnijs-js-compiler",
    "crates/agnijs-js-vm",
    "crates/agnijs-js-regex",
    "crates/agnijs-js-intl",
    "crates/agnijs-js-debugger",
    "crates/agnijs-js-cdp",
    "crates/agnijs-js-test262",
    "crates/agnijs-js-bench",
    "crates/agnijs-js-jit",
    "crates/agnijs-capi",
    "crates/agnijs-js-resolve",
    "crates/agnijs",
    "crates/agnijs-derive",
    "crates/agnijs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/agnijs-rs/agnijs"

[workspace.dependencies]
agnijs-engine-api = { path = "crates/agnijs-engine-api" }
agnijs-engine-quickjs = { path = "crates/agnijs-engine-quickjs" }
agnijs-js-parser = { path = "crates/agnijs-js-parser" }
agnijs-js-compiler = { path = "crates/agnijs-js-compiler" }
# No default features: each member names the engine features it needs, so
# the test262 runner can build the engine without Intl (docs/binary-size.md).
agnijs-js-vm = { path = "crates/agnijs-js-vm", default-features = false }
# No default features: the engine crate (agnijs-js-vm) decides whether the
# linear-time matcher is compiled in.
agnijs-js-regex = { path = "crates/agnijs-js-regex", default-features = false }
agnijs-js-intl = { path = "crates/agnijs-js-intl" }
agnijs-js-debugger = { path = "crates/agnijs-js-debugger" }
agnijs-js-cdp = { path = "crates/agnijs-js-cdp" }
agnijs = { path = "crates/agnijs" }
agnijs-derive = { path = "crates/agnijs-derive" }
# The baseline JIT: optional, behind agnijs-js-vm's `jit` feature (ADR 0020).
agnijs-js-jit = { path = "crates/agnijs-js-jit" }
# Optional Node-style resolver for embedders; no engine crate depends on it (ADR 0023).
agnijs-js-resolve = { path = "crates/agnijs-js-resolve" }
rquickjs = { version = "0.14", features = ["loader", "array-buffer", "classes", "properties"] }
regress = { version = "0.12", features = ["utf16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
anyhow = "1"
unicode-id-start = "1"
# The front end's internal maps (identifier names, scopes): a fast,
# randomly seeded hasher instead of SipHash (TASK-100.26).
foldhash = "0.2"

[profile.release]
debug = 1

# What docs/binary-size.md measures and what a size-conscious embedder
# ships: the release build stripped, with whole-program LTO. Unwinding
# stays on, so a C API's catch_unwind still turns a panic into an error.
[profile.size]
inherits = "release"
debug = 0
strip = "symbols"
lto = "fat"
codegen-units = 1
