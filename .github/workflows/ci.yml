name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # The TypeScript crate (opt-in, ADR 0029) has its own job.
      - run: cargo build --workspace --locked --exclude agnijs-js-typescript --exclude agnijs-example-typescript
      - run: cargo test --workspace --locked --exclude agnijs-js-typescript --exclude agnijs-example-typescript
      - name: Minimal embedding example (docs/embedding-guide.md), run and its output checked
        run: cargo run --locked -p agnijs-example-embed && cargo test --locked -p agnijs-example-embed --test output
      - name: Instructions dispatched per iteration and per call on the hot workloads (TASK-100.18)
        run: cargo test --locked -p agnijs-js-vm --features instr-count --test instr_count
      - name: Regex crate and VM RegExp tests with the linear matcher compiled out
        run: |
          cargo test --locked -p agnijs-js-regex --no-default-features
          cargo test --locked -p agnijs-js-vm --no-default-features --test regexp
      - name: Differential regex fuzzing, bounded (linear vs backtracking, ADR 0013 addendum)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          AGNIJS_REGEX_FUZZ_CASES: "200000"
        run: cargo test --release --locked -p agnijs-js-regex --test differential
      - name: Cache test262 at the pinned commit
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('crates/agnijs-js-test262/PIN') }}
      - run: cargo run --release -p agnijs-js-test262 --bin test262 -- fetch
      - name: test262 RegExp suites under each regex matcher policy (same baseline)
        # Forcing the linear matcher everywhere is slow on the property-escape
        # tests (about 5 min), so that policy runs on one OS only.
        run: |
          modes="backtracking-only"
          if [ "$RUNNER_OS" = "Linux" ]; then modes="$modes linear-when-eligible"; fi
          for m in $modes; do
            cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs --regex-matcher $m \
              --filter test/built-ins/RegExp --filter test/built-ins/String/prototype/match \
              --filter test/built-ins/String/prototype/matchAll --filter test/built-ins/String/prototype/replace \
              --filter test/built-ins/String/prototype/replaceAll --filter test/built-ins/String/prototype/search \
              --filter test/built-ins/String/prototype/split --filter test/language/literals/regexp \
              --filter test/annexB/built-ins/RegExp
          done
        shell: bash
      - name: test262 against the QuickJS-NG baseline
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine quickjs
      - name: test262 parse-only pass of agnijs-js-parser (includes intl402)
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine parse --include-intl402
      - name: test262 against the AgniJS engine baseline
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs
      - name: test262 against the AgniJS engine baseline, every script and module run from bytecode
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs --precompile
      - name: test262 against the AgniJS engine baseline, every test realm restored from a snapshot
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs --snapshot
      - name: host-driven tests on engines restored from a snapshot
        run: cargo test -p agnijs-js-vm --test host_driven
        env:
          AGNIJS_TEST_SNAPSHOT: "1"
      - name: test262 intl402 against the AgniJS intl402 baseline (reported separately)
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs --only-intl402
      - name: test262 Temporal against the AgniJS Temporal baseline (reported separately, TASK-103.8)
        run: cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs --only-temporal

  jit:
    # The baseline JIT (ADR 0020, TASK-101.3.2) with every block compiled on
    # first use, on each host it supports: the JIT crate's own tests (on
    # macOS arm64 the probe must use MAP_JIT and per-thread write
    # protection), the differential and inline-cache tests, the VM suite
    # forced, a test262 slice forced and tiered against the same baseline as
    # the interpreter, and (Ubuntu) a bounded differential fuzz run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: jit
      - run: cargo test --locked -p agnijs-js-jit
      - name: macOS, the probe under the hardened runtime with the allow-jit entitlement
        # The hardened runtime refuses ordinary pages made executable, so
        # the probe succeeds only through MAP_JIT and per-thread write
        # protection (TASK-101.3.2).
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin=$(cargo test --locked -p agnijs-js-jit --test enter --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "enter" and .executable != null) | .executable')
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>com.apple.security.cs.allow-jit</key><true/></dict></plist>' > "$RUNNER_TEMP/jit.entitlements"
          codesign -s - -f --options runtime --entitlements "$RUNNER_TEMP/jit.entitlements" "$bin"
          codesign -d --entitlements - "$bin"
          "$bin" --test-threads 1
      - name: VM suite with every block compiled (AGNIJS_JIT=force)
        env:
          AGNIJS_JIT: force
        run: cargo test --locked -p agnijs-js-vm --features jit
      - name: Crafted bytecode with every case compiled (release, TASK-103.30)
        run: cargo test --release --locked -p agnijs-js-vm --features jit --test bytecode_fuzz
      - name: Benchmark workloads agree across JIT modes
        run: cargo test --locked -p agnijs-js-bench --features jit --test jit_workloads
      - name: Cache test262 at the pinned commit
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('crates/agnijs-js-test262/PIN') }}
      - run: cargo run --release -p agnijs-js-test262 --bin test262 -- fetch
      - name: test262 slice, JIT forced and tiered (same baseline)
        shell: bash
        run: |
          for m in force on; do
            AGNIJS_JIT=$m cargo run --release --locked -p agnijs-js-test262 --features jit --bin test262 -- run --engine agnijs \
              --filter test/language/statements/for --filter test/language/expressions/compound-assignment \
              --filter test/language/expressions/property-accessors --filter test/built-ins/Array/prototype/indexOf \
              --filter test/built-ins/Array/prototype/forEach --filter test/language/arguments-object
          done
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 24
      - name: Differential JIT fuzzing, bounded (interpreter vs on vs force; docs/jit-fuzz.md)
        # The engine crates are already built in release with these features
        # by the test262 slice above, so only the command itself is added.
        # A fixed seed count, not a time budget, so every run covers the
        # same programs.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          cargo build --release --locked -p agnijs-cli --features agnijs-js-vm/jit
          node tools/jit-fuzz/jit-fuzz.mjs --count 40 --minimize-time 120
      - name: Keep the divergent programs
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jit-fuzz-divergences
          path: target/jit-fuzz
          if-no-files-found: ignore

  typescript:
    # The optional TypeScript front end (ADR 0029, TASK-103.13): its fixture
    # suite (compared byte for byte, so the output must be identical on
    # every OS), the engine runs of its output, stack traces and a DevTools
    # breakpoint in TypeScript positions, the hostile-nesting limits in debug
    # and in release, the embedding example, the command built with its
    # `typescript` feature, and clippy.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: typescript
      - run: cargo test --locked -p agnijs-js-typescript
      - name: Hostile nesting at the size limit, release
        run: cargo test --release --locked -p agnijs-js-typescript --test limits
      - run: cargo test --locked -p agnijs-example-typescript
      - run: cargo test --locked -p agnijs-cli --features typescript
      - run: cargo test --locked -p agnijs-fuzz --features typescript --test smoke
      - run: cargo clippy --locked -p agnijs-js-typescript -p agnijs-example-typescript --all-targets --no-deps -- -D warnings
      - run: cargo clippy --locked -p agnijs-cli --features typescript --all-targets --no-deps -- -D warnings
      - run: cargo clippy --locked -p agnijs-fuzz --features typescript --all-targets --no-deps -- -D warnings

  capi:
    # The C API (ADR 0021, TASK-103.3): the Rust tests with fault injection,
    # the bounded fuzz test in release, and the C test program and the C and
    # C++ examples built with CMake and run against the static and the
    # shared library.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: capi
      - run: cargo test --locked -p agnijs-capi --features fault-injection
      - name: Fuzz the C API, bounded (release, 10x the default work)
        timeout-minutes: 10
        env:
          AGNIJS_CAPI_FUZZ_ITERS: "10"
        run: cargo test --release --locked -p agnijs-capi --test fuzz
      - run: cargo build --release --locked -p agnijs-capi
      - name: C test program and C/C++ examples (static and shared)
        shell: bash
        run: |
          cmake -S crates/agnijs-capi/c -B target/capi-c -DCMAKE_BUILD_TYPE=Release -DAGNIJS_LIB_DIR="$PWD/target/release"
          cmake --build target/capi-c --config Release
          ctest --test-dir target/capi-c -C Release --output-on-failure

  fuzz:
    # Every fuzz target of crates/agnijs-fuzz (TASK-103.18, docs/fuzzing.md):
    # its seeds and a fixed number of seeded mutants, so every run covers
    # the same inputs. Release speed with debug assertions and overflow
    # checks (the `fuzz` profile). A failing input is saved under
    # target/fuzz-inputs and uploaded. With the `typescript` target, which
    # needs agnijs-js-typescript (Rust 1.97, stable here).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: fuzz
      - name: Fuzz every target, bounded (fixed seed)
        timeout-minutes: 15
        run: cargo run --profile fuzz --locked -p agnijs-fuzz --features typescript -- all --seed 1
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: target/fuzz-inputs
          if-no-files-found: ignore

  msrv:
    # The workspace's default features built with the toolchain its
    # `rust-version` names (docs/stability.md#minimum-supported-rust-version).
    # The JIT and TypeScript crates (opt-in) and the command declare their
    # own, newer minimums and are left out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The workspace MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: msrv
      - name: Build the workspace at the MSRV (${{ steps.msrv.outputs.version }})
        run: cargo build --workspace --locked --exclude agnijs-js-jit --exclude agnijs-js-typescript --exclude agnijs-example-typescript --exclude agnijs-cli

  capi-checks:
    # The checked-in header matches the sources, clippy is clean, the C test
    # runs under AddressSanitizer and LeakSanitizer, and the raw-pointer
    # helpers and the handle table run under Miri.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: capi-checks
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - name: Header drift (regenerate include/agnijs.h and compare)
        run: |
          cbindgen --config crates/agnijs-capi/cbindgen.toml --crate agnijs-capi --output crates/agnijs-capi/include/agnijs.h
          git diff --exit-code -- crates/agnijs-capi/include/agnijs.h
      - run: cargo clippy --locked -p agnijs-capi --no-deps --all-targets --features fault-injection -- -D warnings
      - name: C test program under AddressSanitizer and LeakSanitizer
        run: |
          cargo build --release --locked -p agnijs-capi
          cmake -S crates/agnijs-capi/c -B target/capi-asan -DCMAKE_BUILD_TYPE=Debug -DAGNIJS_LIB_DIR="$PWD/target/release" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build target/capi-asan
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir target/capi-asan --output-on-failure
      - run: cargo miri setup
      - run: cargo miri test --locked -p agnijs-capi --lib miri_

  semver:
    # The public Rust crates against the base of the push or pull request: a
    # breaking change fails unless the workspace version allows it
    # (docs/stability.md#the-rust-api). A push that creates a branch, or whose
    # base is gone after a force push, is compared with its parent commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: semver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      - name: agnijs and agnijs-engine-api against the base (cargo-semver-checks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD^)
          fi
          echo "Baseline: $BASE"
          cargo semver-checks -p agnijs -p agnijs-engine-api --baseline-rev "$BASE"

  cli:
    # The agnijs command (TASK-103.16): its tests spawn the binary (files,
    # stdin, eval, the REPL over a pipe, bytecode, snapshots, source maps and
    # a DevTools client on --inspect-brk), and clippy is clean.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: cli
      - run: cargo test --locked -p agnijs-cli
      - run: cargo clippy --locked -p agnijs-cli --all-targets --no-deps -- -D warnings

  size-profiles:
    # The smaller builds docs/binary-size.md documents (TASK-103.5): the
    # engine without Intl, and with ICU4X data trimmed to a locale list,
    # each against its baselines; the wasm32 build; and the size report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: size-profiles
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: No Intl, the feature test and the C API tests
        run: |
          cargo test --locked -p agnijs-js-vm --no-default-features --features linear-regex --test intl_feature
          cargo test --locked -p agnijs-capi --no-default-features --features linear-regex
      - name: Cache test262 at the pinned commit
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('crates/agnijs-js-test262/PIN') }}
      - run: cargo run --release -p agnijs-js-test262 --bin test262 -- fetch
      - name: No Intl, test262 against the main baseline (scripts and bytecode)
        run: |
          cargo run --release --locked -p agnijs-js-test262 --no-default-features --features linear-regex --bin test262 -- run --engine agnijs
          cargo run --release --locked -p agnijs-js-test262 --no-default-features --features linear-regex --bin test262 -- run --engine agnijs --precompile
      - name: Cache icu4x-datagen
        id: datagen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/icu4x-datagen
          key: icu4x-datagen-2.4.0-unstable
      - if: steps.datagen.outputs.cache-hit != 'true'
        # rust-cache can restore ~/.cargo/bin with the binary in it while this
        # cache misses, and cargo install refuses to overwrite it.
        run: |
          if icu4x-datagen --version 2>/dev/null | grep -q '2\.4\.0'; then exit 0; fi
          cargo install icu4x-datagen --version 2.4.0 --locked --features unstable --force
      - name: Trimmed Intl data (en, de, no segmenter models)
        run: node crates/agnijs-js-intl/tools/gen-icu4x-data.js --out "$RUNNER_TEMP/icu-en-de" --locales en,de --segmenter-models none
      - name: Trimmed Intl data, the feature test and test262 against the main baseline
        env:
          ICU4X_DATA_DIR: ${{ runner.temp }}/icu-en-de
        run: |
          cargo test --locked -p agnijs-js-vm --test intl_feature
          cargo run --release --locked -p agnijs-js-test262 --bin test262 -- run --engine agnijs
      - name: wasm32 builds, with and without Intl
        run: |
          cargo build --locked --release -p agnijs-js-vm --example size_probe --target wasm32-unknown-unknown
          cargo build --locked --release -p agnijs-js-vm --example size_probe --target wasm32-unknown-unknown --no-default-features --features linear-regex
      - name: Size report
        run: node scripts/size-report.mjs --wasm --data "en, de, no segmenter models=$RUNNER_TEMP/icu-en-de" | tee -a "$GITHUB_STEP_SUMMARY"

  standalone:
    # The engine must build and test with nothing else beside it (ADR 0016):
    # export only the tracked files into an empty directory outside the
    # checkout and build there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Export the tracked files alone
        run: |
          mkdir "$RUNNER_TEMP/engine"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/engine"
          ls -A "$RUNNER_TEMP/engine"
      - run: cargo build --workspace --locked --exclude agnijs-js-typescript --exclude agnijs-example-typescript
        working-directory: ${{ runner.temp }}/engine
      - run: cargo test --workspace --locked --exclude agnijs-js-typescript --exclude agnijs-example-typescript
        working-directory: ${{ runner.temp }}/engine

  gc-stress:
    # Every interpreter safe point collects (AGNIJS_GC_STRESS=1) in the unit
    # tests; a test262 slice runs with a collection every 16 safe points.
    # Finds missing roots, the one class of GC bug the arena design admits
    # (ADR 0009).
    runs-on: ubuntu-latest
    env:
      AGNIJS_GC_STRESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --locked -p agnijs-js-vm -p agnijs-js-compiler
      - name: C API handles and host objects under GC stress
        # The allocation-limit, deep-nesting and fuzz tests are skipped: a
        # collection at every safe point makes them take hours.
        run: >-
          cargo test --locked -p agnijs-capi --features fault-injection --lib --test basics --test hostile --test fault_injection --
          --skip the_memory_limit --skip deeply_nested --skip stack_budget
      - name: Cache test262 at the pinned commit
        uses: actions/cache@v4
        with:
          path: test262
          key: test262-${{ hashFiles('crates/agnijs-js-test262/PIN') }}
      - run: cargo run --release -p agnijs-js-test262 --bin test262 -- fetch
      - name: test262 language slice under GC stress
        run: AGNIJS_GC_STRESS=16 cargo run --release -p agnijs-js-test262 --bin test262 -- run --engine agnijs --filter test/language/statements/class --filter test/language/expressions/assignment --filter test/language/statements/for-of --timeout-ms 60000

  miri:
    # The VM has no unsafe code; Miri checks the dependencies we lean on
    # (hashbrown, indexmap) and the arena discipline under its stricter
    # aliasing and uninitialised-memory rules. Only the collector tests run:
    # the full engine under Miri is too slow. The loops are shrunk under Miri
    # (cfg!(miri) in tests/gc.rs); one job per test keeps the wall time to the
    # slowest test. The full-size run is tools/miri-local.mjs (docs/miri-local.md).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test:
          - small_program_under_gc_stress
          - live_data_survives_collection
          - recycled_storage_starts_empty
          - weak_containers_are_processed
          - weak_map_string_and_bigint_values_survive
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: miri
          save-if: ${{ matrix.test == 'small_program_under_gc_stress' }}
      - run: cargo miri setup
      - run: cargo miri test --locked -p agnijs-js-vm --test gc -- --exact ${{ matrix.test }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  sanitizers:
    # AddressSanitizer over the collector tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu -p agnijs-js-vm --test gc
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          # Fake stacks for use-after-return detection (on by default on
          # Linux) move locals off the thread's stack, so the stack budget,
          # which reads its position from a local's address, would see
          # unrelated addresses (agnijs-js-regex src/stack.rs).
          ASAN_OPTIONS: detect_stack_use_after_return=0

  licenses:
    # Every dependency must be under a license compatible with MIT OR
    # Apache-2.0 (TASK-100.12); see THIRD-PARTY-NOTICES for the Unicode data.
    runs-on: ubuntu-latest
    steps:
