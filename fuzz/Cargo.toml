# Coverage-guided fuzzing with cargo-fuzz and libFuzzer (docs/fuzzing.md).
# Each target hands libFuzzer's input to the function of the same name in
# crates/agnijs-fuzz. Its own workspace: it needs nightly, and the engine
# workspace builds on stable without it (ADR 0016).
#
#   cargo +nightly fuzz run parse -- -max_total_time=300
#
# There is no lock file here: copy the workspace's (cp Cargo.lock
# fuzz/Cargo.lock) so the engine's dependencies match what CI tests, and
# cargo adds libfuzzer-sys to it.

[package]
name = "agnijs-fuzz-libfuzzer"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agnijs-fuzz = { path = "../crates/agnijs-fuzz" }

[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
