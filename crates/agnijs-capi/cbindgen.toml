# Generates include/agnijs.h. CI regenerates it and fails when the checked-in
# header differs (see docs/c-api.md, "Header").
language = "C"
include_guard = "AGNIJS_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "type"
sort_by = "None"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen from crates/agnijs-capi; do not edit. Regenerate with:\n *   cbindgen --config crates/agnijs-capi/cbindgen.toml --crate agnijs-capi --output crates/agnijs-capi/include/agnijs.h\n */"
header = """/*
 * AgniJS C API. See docs/c-api.md for the ownership, threading, reentrancy
 * and versioning rules. In short:
 *
 * - Every function returns an AgnijsStatus: 0 is success, positive values
 *   are outcomes of running JavaScript, negative values are errors in the
 *   call. agnijs_last_error() has the message.
 * - Everything the library hands out is a 64-bit id; 0 is never valid.
 *   Freed or foreign ids are reported, never dereferenced.
 * - An engine is used only on the thread that created it.
 * - No function panics or aborts; no allocation crosses the boundary.
 */"""

[defines]
"feature = fault-injection" = "AGNIJS_FAULT_INJECTION"

[export]
include = [
  "AgnijsEngineOptions",
  "AgnijsClassDef",
  "AgnijsException",
  "AgnijsMemoryUsage",
  "AgnijsCallInfo",
]

[fn]
args = "auto"

[enum]
prefix_with_name = false
