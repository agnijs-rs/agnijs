[package]
name = "agnijs-js-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Engine micro-benchmarks: the same JS workloads on every engine behind the engine interface"
publish = false

[features]
# Build the engine with the baseline JIT; AGNIJS_JIT picks when it runs.
jit = ["agnijs-js-vm/jit"]

[dependencies]
agnijs-engine-api.workspace = true
agnijs-engine-quickjs.workspace = true
agnijs-js-vm = { workspace = true, features = ["linear-regex", "intl"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true

# Process peak working set. Already in the lockfile (through clap), so the
# standalone build stays offline-lockable.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bin]]
name = "bench"
path = "src/main.rs"
