[package]
name = "agnijs-js-regex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "agnijs-js-regex"

[features]
default = ["linear"]
# The linear-time matcher (ADR 0013 addendum). Without it every pattern
# runs on the backtracking matcher, whatever the matcher mode says.
linear = []

[dependencies]
unicode-id-start.workspace = true

[dev-dependencies]
# The previous matcher (ADR 0013), now only the reference that
# tests/differential.rs compares against (TASK-100.31).
regress.workspace = true
