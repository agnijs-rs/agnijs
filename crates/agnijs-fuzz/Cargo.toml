[package]
name = "agnijs-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Fuzz targets for AgniJS: a bounded, seeded runner for CI and the functions the cargo-fuzz targets in fuzz/ call"
publish = false

[lib]
name = "agnijs_fuzz"

[[bin]]
name = "agnijs-fuzz"
path = "src/main.rs"

[dependencies]
agnijs-engine-api.workspace = true
agnijs-js-parser.workspace = true
agnijs-js-compiler.workspace = true
agnijs-js-vm = { workspace = true, features = ["linear-regex", "intl", "temporal"] }
agnijs-js-regex = { workspace = true, features = ["linear"] }
agnijs-js-debugger.workspace = true
agnijs-js-cdp.workspace = true
agnijs-js-resolve.workspace = true
serde_json.workspace = true
# The typescript target (ADR 0029); it needs Rust 1.97, above the
# workspace minimum, so it is opt-in.
agnijs-js-typescript = { workspace = true, optional = true }

[features]
typescript = ["dep:agnijs-js-typescript"]
