[package]
name = "agnijs-js-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The AgniJS JavaScript virtual machine: interpreter, object model, heap and GC, built-ins"

[features]
default = ["linear-regex"]
# The linear-time regular-expression matcher (ADR 0013 addendum). Without
# it every pattern backtracks, whatever Host::regex_matcher says.
linear-regex = ["agnijs-js-regex/linear"]
# Counts dispatched instructions in `Vm::instr_count` (TASK-100.18). For
# the instruction-count tests only; it adds a store per instruction.
instr-count = []
# Counts inline-cache hits, misses and fills in `Vm::ic_stats`
# (TASK-100.20). For measurement only.
ic-stats = []
# The baseline JIT (TASK-101.3, ADR 0020): Cranelift-compiled code for hot
# functions, chosen at run time by AGNIJS_JIT (off, on, force) or
# `Vm::set_jit_mode`. Off by default; without it the engine has no
# dependency on the code generator and no unsafe code anywhere.
jit = ["dep:agnijs-js-jit"]

[dependencies]
agnijs-engine-api.workspace = true
agnijs-js-parser.workspace = true
agnijs-js-compiler.workspace = true
agnijs-js-regex.workspace = true
agnijs-js-intl.workspace = true
agnijs-js-debugger.workspace = true
agnijs-js-jit = { workspace = true, optional = true }
hashbrown = "0.14"
indexmap = "2"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
