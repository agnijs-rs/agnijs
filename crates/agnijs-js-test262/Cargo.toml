[package]
name = "agnijs-js-test262"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "agnijs-js-test262"

[features]
default = ["intl", "linear-regex"]
# The engine's ECMA-402. Without it (`--no-default-features --features
# linear-regex`) the main suite runs against the same baseline; intl402
# needs it (docs/binary-size.md).
intl = ["agnijs-js-vm/intl"]
linear-regex = ["agnijs-js-vm/linear-regex"]
# Build the engine with the baseline JIT; AGNIJS_JIT picks when it runs.
jit = ["agnijs-js-vm/jit"]

[dependencies]
agnijs-engine-api.workspace = true
agnijs-engine-quickjs.workspace = true
agnijs-js-vm.workspace = true
agnijs-js-parser.workspace = true
agnijs-js-compiler.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
walkdir.workspace = true
rayon.workspace = true
anyhow.workspace = true

[[bin]]
name = "test262"
path = "src/main.rs"
